name: LMS security unit tests
on:
  push:
    branches: [lms-phase2b]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run LMS tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in lib/*.js api/lms/*.js scripts/*.js lms/*.js; do
            node --check "$file"
          done
