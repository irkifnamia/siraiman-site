<main>
<section class="band"><div class="container section"><div id="chapter-list"></div><p class="info"><strong>Note:</strong> Chapter and subchapter names are temporary placeholders until the official SM025 syllabus is supplied.</p></div></section></main>
<footer><div class="container"><span>© SIR AIMAN SITE</span><span>SM025 · Mathematics Semester 2</span></div></footer>
<script>document.addEventListener('DOMContentLoaded',()=>{const data=window.SIR_AIMAN_CONTENT;const subject=data?.subjects?.find(s=>s.id==='SM025');const list=document.getElementById('chapter-list');if(!subject)return;for(const chapter of subject.chapters){const details=document.createElement('details');details.className='chapter';const summary=document.createElement('summary');summary.textContent=chapter.title;const ul=document.createElement('ul');for(const sc of chapter.subchapters){const li=document.createElement('li');li.textContent=sc.title;ul.append(li)}details.append(summary,ul);list.append(details)}})</script></body></html>
